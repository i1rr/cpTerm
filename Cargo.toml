[package]
name = "cpt"
version = "0.1.7"
edition = "2024"
rust-version = "1.100"

[dependencies]
ratatui = { version = "0.30", features = ["serde"] }
ratatui-textarea = { version = "0.8", features = ["search"] }
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
clap = { version = "4", features = ["derive"] }
confy = "1"
serde = { version = "1", features = ["derive"] }
color-eyre = "0.6"
open = "5"
toml = "0.8"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
unicode-width = "0.2"
log = "0.4"
ssh2 = { version = "0.9.7", features = ["openssl-on-win32"] }
base64 = "0.22"
zeroize = "1.9.1"
tempfile = "3"
getrandom = "0.4"
flate2 = "1"
tar = { version = "0.4.46", default-features = false }
zip = { version = "=9.4.1", default-features = false, features = ["deflate-flate2", "deflate64", "bzip2"] }
cap-std = "4"
cap-fs-ext = { version = "4", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[profile.release]
lto = true
