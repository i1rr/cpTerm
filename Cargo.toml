[package]
name = "cpt"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.30", features = ["serde"] }
ratatui-textarea = { version = "0.8", features = ["search"] }
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
clap = { version = "4", features = ["derive"] }
confy = "0.6"
serde = { version = "1", features = ["derive"] }
color-eyre = "0.6"
open = "5"
toml = "0.8"
chrono = "0.4"
unicode-width = "0.2"
log = "0.4"

[profile.release]
lto = true
