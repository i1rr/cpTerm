name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/audit_lock.py

  check:
    needs: audit
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip unzip openssh-server
      - run: cargo +stable test --locked
      - if: runner.os == 'Linux'
        run: bash .github/scripts/test-sftp.sh
